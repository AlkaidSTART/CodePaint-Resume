version: 1

# Capability tiers are abstract. Bind them to concrete providers/models in the
# runner that consumes this file; do not put credentials or provider secrets here.
levels:
  small:
    purpose: deterministic, bounded implementation work
    strengths:
      - local edits with explicit acceptance criteria
      - mechanical refactors with a narrow diff
      - focused tests and documentation updates
    must_not_decide:
      - architecture or public API design
      - security-sensitive behavior
      - destructive data changes
      - scope expansion

  medium:
    purpose: multi-file implementation and failure diagnosis
    strengths:
      - module-level changes
      - API implementation with existing contracts
      - test strategy and verification failure analysis
      - ordinary code review
    must_escalate:
      - destructive migrations
      - direct security changes
      - unresolved ambiguity after context gathering

  strong:
    purpose: high-risk reasoning, planning, and adjudication
    strengths:
      - architecture and cross-module design
      - public API and compatibility analysis
      - security and data migration review
      - replanning when the current plan is invalid

roles:
  planner:
    default_level: strong
    allowed_levels: [medium, strong]
    outputs:
      - classification
      - context_pack
      - plan
      - task_dependency_graph
      - acceptance_criteria

  coder:
    default_level: small
    allowed_levels: [small, medium]
    constraints:
      - execute only a ready task
      - modify only declared allowed_paths
      - report plan gaps instead of expanding scope
      - record changed files and verification evidence

  reviewer:
    default_level: medium
    allowed_levels: [medium, strong]
    outputs:
      - plan_alignment_review
      - diff_review
      - residual_risks
      - review_decision

  security:
    default_level: strong
    allowed_levels: [strong]
    required_for:
      - direct security impact
      - secret or permission boundary changes
      - production-affecting changes

defaults:
  planning_level: medium
  implementation_level: small
  review_level: medium
  incomplete_classification_level: strong
  max_retries_per_task: 2

escalation:
  - trigger: verification_failure_after_retry
    action: diagnose_with_medium_or_strong_and_replan_if_needed
  - trigger: task_scope_violation
    action: stop_task_and_require_replan
  - trigger: conflicting_requirements
    action: stop_and_request_human_decision
  - trigger: missing_or_untrusted_context
    action: escalate_to_strong
