version: 1

enforcement:
  default: deny
  deny_overrides_allow: true
  path_format: repository_relative_glob
  unlisted_commands: deny
  unlisted_write_paths: deny

# The control plane must be readable by all roles. Only runtime artifacts may
# be written during normal execution; policy and schema changes need approval.
control_plane:
  read:
    - harness/**
  write:
    - harness/runtime/plans/**
    - harness/runtime/tasks/**
    - harness/runtime/states/**
  approval_required:
    - harness/politics/**
    - harness/rules/**
    - harness/schemas/**
    - harness/templates/**
    - harness/checks/**

workspace:
  read:
    - '**/*'
  write:
    - apps/**
    - packages/**
    - backend/**
    - docs/**
    - migrations/**
  approval_required:
    - package.json
    - pnpm-lock.yaml
    - tsconfig*.json
    - vite.config.*
    - .github/**
    - deploy/**
    - production/**

protected:
  read_denied:
    - .env
    - .env.*
    - '**/*.pem'
    - '**/*.key'
    - secrets/**
    - credentials/**
  write_denied:
    - .env
    - .env.*
    - '**/*.pem'
    - '**/*.key'
    - secrets/**
    - credentials/**
    - production/**
  delete_denied:
    - .git/**
    - harness/politics/**
    - harness/rules/**
    - harness/schemas/**

commands:
  allowed:
    - bash harness/checks/validate.sh
    - bash harness/checks/lint.sh
    - bash harness/checks/typecheck.sh
    - bash harness/checks/test.sh
    - bash harness/checks/backend.sh
    - bash harness/checks/build.sh
    - bash harness/checks/verify.sh
    - pnpm run lint
    - pnpm run typecheck
    - pnpm run build
    - pnpm install
    - go test ./...
    - go vet ./...
    - go build ./cmd/...
    - node
    - ruby
  approval_required:
    - pnpm add
    - git commit
    - git push
    - docker compose -f deploy/compose/docker-compose.yml up -d
    - go get
    - production database migration
  denied:
    - rm -rf /
    - git reset --hard
    - production database drop
