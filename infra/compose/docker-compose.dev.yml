services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resumeflow
      POSTGRES_USER: resumeflow
      POSTGRES_PASSWORD: resumeflow_dev_only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ../migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeflow -d resumeflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: resumeflow
      MINIO_ROOT_PASSWORD: resumeflow_dev_only
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://resumeflow:resumeflow_dev_only@postgres:5432/resumeflow?sslmode=disable
      MIGRATIONS_DIR: /workspace/migrations
    volumes:
      - ../migrations:/workspace/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      PORT: "8080"
      ALLOW_DEMO_AUTH: "true"
      DATABASE_URL: postgres://resumeflow:resumeflow_dev_only@postgres:5432/resumeflow?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      DEFAULT_WORKSPACE_ID: 00000000-0000-0000-0000-000000000001
      COOKIE_SECURE: "false"
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: resumeflow
      STORAGE_SECRET_KEY: resumeflow_dev_only
      STORAGE_BUCKET: resumeflow
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DEFAULT_WORKSPACE_ID: 00000000-0000-0000-0000-000000000001
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
